<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Education Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/education.css') }}"/>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="card-wrap">
    <div class="glass-card">
      <div class="gloss"></div>

      <div class="card-header">
        <div class="logo-mark">🎓</div>
        <h1>Education Details</h1>
        <p class="subtitle">Apni education ki jaankari bharo</p>
      </div>

      <form id="edu-form" method="POST" action="/submit-education" novalidate>

        <!-- Username (Foreign Key) -->
        <div class="field-group" id="group-username">
          <label for="username">Username <span class="fk-badge">🔗 Foreign Key</span></label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            {% if users %}
            <select id="username" name="username" required>
              <option value="">-- Username chunao --</option>
              {% for u in users %}
              <option value="{{ u }}">{{ u }}</option>
              {% endfor %}
            </select>
            {% else %}
            <input type="text" id="username" name="username" placeholder="Registered username" required/>
            {% endif %}
          </div>
          <span class="field-error"></span>
        </div>

        <!-- College Name -->
        <div class="field-group" id="group-college_name">
          <label for="college_name">College Name</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            </span>
            <input type="text" id="college_name" name="college_name" placeholder="e.g. IIT Delhi" required/>
          </div>
          <span class="field-error"></span>
        </div>

        <!-- Degree -->
        <div class="field-group" id="group-degree">
          <label for="degree">Degree</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
              </svg>
            </span>
            <select id="degree" name="degree" required>
              <option value="">-- Degree chunao --</option>
              <option>B.Tech</option>
              <option>BCA</option>
              <option>B.Sc</option>
              <option>BBA</option>
              <option>B.Com</option>
              <option>MCA</option>
              <option>M.Tech</option>
              <option>MBA</option>
              <option>Other</option>
            </select>
          </div>
          <span class="field-error"></span>
        </div>

        <!-- Year -->
        <div class="field-group" id="group-year">
          <label for="year">Year</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <select id="year" name="year" required>
              <option value="">-- Year chunao --</option>
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
              <option>Passed Out</option>
            </select>
          </div>
          <span class="field-error"></span>
        </div>

        <!-- City -->
        <div class="field-group" id="group-city">
          <label for="city">City</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
            </span>
            <input type="text" id="city" name="city" placeholder="e.g. Jaipur" required/>
          </div>
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn-signup" id="btn-submit">
          <span class="btn-text">Save Education Details</span>
          <span class="btn-loader"></span>
        </button>

        <div class="form-msg" id="form-msg" role="alert"></div>
      </form>

      <div class="nav-links">
        <a href="/">← Registration Form</a>
        <a href="/combined">View Combined Data →</a>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/education.js') }}"></script>
</body>
</html>
