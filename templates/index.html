<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <!-- Google Fonts: Clash Display + DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Separate CSS file -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- Floating orb decorations -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ── Glass Card ── -->
  <main class="card-wrap">
    <div class="glass-card">

      <!-- Gloss reflection strip -->
      <div class="gloss"></div>

      <!-- Header -->
      <div class="card-header">
        <div class="logo-mark">✦</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join the experience. It only takes a moment.</p>
      </div>

      <!-- Form -->
      <form id="signup-form" method="POST" action="/submit" novalidate>

        <!-- Phone -->
        <div class="field-group" id="group-phone">
          <label for="phone">Phone Number</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .92h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
              </svg>
            </span>
            <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required />
          </div>
          <span class="field-error"></span>
        </div>

        <!-- Username -->
        <div class="field-group" id="group-username">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" placeholder="cool_username" required minlength="3" />
          </div>
          <span class="field-error"></span>
        </div>

        <!-- Email -->
        <div class="field-group" id="group-email">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <span class="field-error"></span>
        </div>

        <!-- Password -->
        <div class="field-group" id="group-password">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6" />
            <button type="button" class="toggle-pw" aria-label="Toggle password visibility" tabindex="-1">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="field-error"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-signup" id="btn-submit">
          <span class="btn-text">Sign Up</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>

        <!-- Global message area -->
        <div class="form-msg" id="form-msg" role="alert" aria-live="polite"></div>

      </form>

      <p class="signin-link">Already have an account? <a href="#">Sign in</a></p>

    </div>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
